<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Track and Field</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Track & Field">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1730">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:ital,wght@0,500;0,700;0,800;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/main.js"></script>
<script>
// if the game didn't start (pieces of an old and a new version mixed, a slow connection with the kept copy), the
// copy is thrown away and the page loads again from the internet: once, and only with connection
addEventListener('load',function(){ setTimeout(function(){
  if(window.__odb||!navigator.onLine) return;
  try{ if(sessionStorage.getItem('odb-reloaded')) return; sessionStorage.setItem('odb-reloaded','1'); }catch(e){ return; }
  (window.caches?caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }):Promise.resolve()).then(function(){ location.reload(); },function(){ location.reload(); });
},6000); });
</script>
</head>
<body>
<canvas id="game"></canvas>
<p id="rot" hidden>Girá el celular para jugar en horizontal</p>
<div id="ov"></div>
<div id="safe"></div>
<div id="splash" aria-hidden="true"><img src="assets/icons/splash.jpg" alt=""><div class="s-title"><b>TRACK</b><b>&amp; FIELD</b></div></div>
</body>
</html>
